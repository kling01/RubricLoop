<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">AgentEval</title>
  <desc id="desc">Make agent behavior inspectable. Trace to executable rubric to evidence and review.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1124"/>
      <stop offset="1" stop-color="#161B38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#71CCFF"/>
      <stop offset="1" stop-color="#AD9AFF"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18243E"/>
      <stop offset="1" stop-color="#151C32"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#background)"/>
  <path d="M985 0V460M1065 0V460M1145 0V460M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200" stroke="#869ED1" stroke-opacity=".055" fill="none"/>
  <rect x="52" y="44" width="6" height="18" rx="3" fill="#89B8FF"/>
  <text x="71" y="59" fill="#A9B9D9" font-size="15" font-weight="600" letter-spacing="3" font-family="Arial, Helvetica, sans-serif">OPEN EVALUATION TOOLING</text>
  <g transform="translate(52 91)" stroke="url(#accent)" stroke-width="3.5" fill="none" stroke-linejoin="round">
    <path d="M0 48L25 0H43L68 48M13 25H55"/>
    <path d="M80 0H113M80 24H106M80 48H113M80 0V48"/>
  </g>
  <text x="187" y="146" fill="#F1F5FF" font-size="72" font-weight="700" letter-spacing="-3" font-family="Arial, Helvetica, sans-serif">AgentEval</text>
  <text x="54" y="191" fill="#B8C8E5" font-size="25" font-family="Arial, Helvetica, sans-serif">Make agent behavior inspectable.</text>
  <text x="1139" y="58" text-anchor="end" fill="#A9B9D9" font-size="14" letter-spacing="1.5" font-family="Arial, Helvetica, sans-serif">CODE · MODEL · HYBRID</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="52" y="236" width="316" height="132" rx="14" fill="url(#card)" stroke="#344260"/>
    <rect x="442" y="236" width="316" height="132" rx="14" fill="url(#card)" stroke="#6C75C0"/>
    <rect x="832" y="236" width="316" height="132" rx="14" fill="url(#card)" stroke="#344260"/>
    <text x="76" y="268" fill="#8EABD6" font-size="14" letter-spacing="2">01 / INPUT</text>
    <text x="76" y="306" fill="#F1F5FF" font-size="28" font-weight="600">Trace</text>
    <text x="76" y="342" fill="#AFC0DE" font-size="17">Messages and execution context</text>
    <text x="466" y="268" fill="#B6ABF5" font-size="14" letter-spacing="2">02 / EVALUATE</text>
    <text x="466" y="306" fill="#F1F5FF" font-size="28" font-weight="600">Executable rubric</text>
    <text x="466" y="342" fill="#AFC0DE" font-size="17">Code rules and model judgments</text>
    <text x="856" y="268" fill="#8EABD6" font-size="14" letter-spacing="2">03 / INSPECT</text>
    <text x="856" y="306" fill="#F1F5FF" font-size="28" font-weight="600">Evidence &amp; review</text>
    <text x="856" y="342" fill="#AFC0DE" font-size="17">Per-criterion results, HTML + JSON</text>
  </g>
  <g stroke="url(#accent)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M383 301H426M419 294L426 301L419 308"/>
    <path d="M773 301H816M809 294L816 301L809 308"/>
  </g>
  <circle cx="59" cy="412" r="4" fill="#7DD4C4"/>
  <text x="73" y="417" fill="#A9B9D9" font-size="16" font-family="Arial, Helvetica, sans-serif">Start offline. Bring your traces. Inspect every criterion.</text>
  <text x="1148" y="417" text-anchor="end" fill="#879ABF" font-size="15" font-family="Arial, Helvetica, sans-serif">github.com/kling01/agenteval</text>
